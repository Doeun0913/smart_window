<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home IoT Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0D0D0F;
            min-height: 100vh;
            color: white;
        }
        
        .background-effects {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }
        
        .bg-gradient-1 {
            position: absolute;
            top: 20%;
            left: 10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
        }
        
        .bg-gradient-2 {
            position: absolute;
            bottom: 20%;
            right: 10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
        }
        
        .header {
            position: relative;
            z-index: 10;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        
        .header-content {
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }
        
        .logo i {
            color: #667eea;
        }
        
        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .connected { 
            background: rgba(16, 185, 129, 0.15); 
            color: #10b981; 
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
        .disconnected { 
            background: rgba(239, 68, 68, 0.15); 
            color: #ef4444; 
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .container {
            position: relative;
            z-index: 10;
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .dashboard-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .metric-card {
            padding: 1.5rem;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        
        .temp-card {
            background: linear-gradient(135deg, rgba(244, 63, 94, 0.1) 0%, rgba(251, 146, 60, 0.05) 100%);
            border-color: rgba(244, 63, 94, 0.2);
        }
        
        .humidity-card {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.1) 0%, rgba(59, 130, 246, 0.05) 100%);
            border-color: rgba(6, 182, 212, 0.2);
        }
        
        .metric-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        
        .temp-icon { color: #f43f5e; }
        .humidity-icon { color: #06b6d4; }
        
        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: white;
            margin-bottom: 0.25rem;
        }
        
        .metric-unit {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .metric-status {
            display: inline-flex;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 0.5rem;
        }
        
        .status-good {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }
        
        .status-warning {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }
        
        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
        
        .nav-btn {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }
        
        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }
        
        .nav-btn i {
            font-size: 1.2rem;
            color: #667eea;
        }
        
        .nav-btn span {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .maintenance-btn {
            background: rgba(245, 158, 11, 0.1);
            border-color: rgba(245, 158, 11, 0.2);
        }
        
        .maintenance-btn i {
            color: #f59e0b;
        }
        
        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            padding: 1rem;
        }
        
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 0.5rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="background-effects">
        <div class="bg-gradient-1"></div>
        <div class="bg-gradient-2"></div>
    </div>
    
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-home"></i>
                Smart Home IoT
            </div>
            <div id="connection-status" class="connection-status disconnected">
                <i class="fas fa-circle"></i>
                연결 중...
            </div>
        </div>
    </div>
    
    <div class="container">
        <div class="dashboard-grid">
            <!-- 현재 측정값 -->
            <div class="metric-grid">
                <div class="metric-card temp-card">
                    <div class="metric-icon temp-icon">
                        <i class="fas fa-thermometer-half"></i>
                    </div>
                    <div class="metric-value" id="temperature">--</div>
                    <div class="metric-unit">°C</div>
                    <div class="metric-status status-good" id="temp-status">정상</div>
                </div>
                
                <div class="metric-card humidity-card">
                    <div class="metric-icon humidity-icon">
                        <i class="fas fa-tint"></i>
                    </div>
                    <div class="metric-value" id="humidity">--</div>
                    <div class="metric-unit">%</div>
                    <div class="metric-status status-good" id="humidity-status">정상</div>
                </div>
            </div>
            
            <!-- 시스템 상태 -->
            <div class="card">
                <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-server" style="color: #667eea;"></i>
                    시스템 상태
                </h3>
                <div id="system-status" class="loading">
                    <div class="spinner"></div>
                    시스템 정보를 로드하는 중...
                </div>
            </div>
            
            <!-- 네비게이션 버튼 -->
            <div class="nav-buttons">
                <a href="#" class="nav-btn" onclick="showDetail('temperature')">
                    <i class="fas fa-thermometer-half"></i>
                    <span>온도 상세</span>
                </a>
                <a href="#" class="nav-btn" onclick="showDetail('air')">
                    <i class="fas fa-leaf"></i>
                    <span>공기질</span>
                </a>
                <a href="#" class="nav-btn" onclick="showDetail('noise')">
                    <i class="fas fa-volume-up"></i>
                    <span>소음 분석</span>
                </a>
            </div>
            
            <!-- 유지보수 센터 버튼 -->
            <a href="http://localhost:3002" class="nav-btn maintenance-btn" target="_blank">
                <i class="fas fa-tools"></i>
                <span>유지보수 센터</span>
            </a>
        </div>
    </div>
    
    <script>
        let ws;
        let isConnected = false;
        
        function connectWebSocket() {
            const connectionStatus = document.getElementById('connection-status');
            
            try {
                ws = new WebSocket('ws://localhost:3001');
                
                ws.onopen = function() {
                    console.log('WebSocket 연결됨');
                    isConnected = true;
                    connectionStatus.className = 'connection-status connected';
                    connectionStatus.innerHTML = '<i class="fas fa-circle"></i> Live';
                    
                    // 초기 데이터 요청
                    requestData();
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        updateDashboard(data);
                    } catch (error) {
                        console.error('메시지 파싱 오류:', error);
                    }
                };
                
                ws.onclose = function() {
                    console.log('WebSocket 연결 해제됨');
                    isConnected = false;
                    connectionStatus.className = 'connection-status disconnected';
                    connectionStatus.innerHTML = '<i class="fas fa-circle"></i> Offline';
                    
                    // 5초 후 재연결 시도
                    setTimeout(connectWebSocket, 5000);
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket 오류:', error);
                    isConnected = false;
                    connectionStatus.className = 'connection-status disconnected';
                    connectionStatus.innerHTML = '<i class="fas fa-circle"></i> 연결 오류';
                };
                
            } catch (error) {
                console.error('WebSocket 연결 실패:', error);
                connectionStatus.className = 'connection-status disconnected';
                connectionStatus.innerHTML = '<i class="fas fa-circle"></i> 연결 실패';
                setTimeout(connectWebSocket, 5000);
            }
        }
        
        function requestData() {
            // REST API로 데이터 요청
            fetch('http://localhost:3001/api/current')
                .then(response => response.json())
                .then(data => updateDashboard(data))
                .catch(error => {
                    console.error('데이터 요청 실패:', error);
                    // 샘플 데이터로 대체
                    updateDashboard({
                        temperature: 22.5,
                        humidity: 45.2,
                        timestamp: new Date().toISOString()
                    });
                });
        }
        
        function updateDashboard(data) {
            // 온도 업데이트
            if (data.temperature !== undefined) {
                document.getElementById('temperature').textContent = data.temperature.toFixed(1);
                updateStatus('temp-status', data.temperature, 18, 26);
            }
            
            // 습도 업데이트
            if (data.humidity !== undefined) {
                document.getElementById('humidity').textContent = data.humidity.toFixed(0);
                updateStatus('humidity-status', data.humidity, 40, 60);
            }
            
            // 시스템 상태 업데이트
            updateSystemStatus();
        }
        
        function updateStatus(elementId, value, minGood, maxGood) {
            const element = document.getElementById(elementId);
            if (value >= minGood && value <= maxGood) {
                element.className = 'metric-status status-good';
                element.textContent = '정상';
            } else {
                element.className = 'metric-status status-warning';
                element.textContent = '주의';
            }
        }
        
        function updateSystemStatus() {
            const systemStatus = document.getElementById('system-status');
            systemStatus.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; text-align: left;">
                    <div>
                        <div style="color: rgba(255,255,255,0.6); font-size: 0.8rem;">백엔드</div>
                        <div style="color: #10b981; font-size: 0.9rem;">✓ 실행 중</div>
                    </div>
                    <div>
                        <div style="color: rgba(255,255,255,0.6); font-size: 0.8rem;">데이터베이스</div>
                        <div style="color: #10b981; font-size: 0.9rem;">✓ 연결됨</div>
                    </div>
                    <div>
                        <div style="color: rgba(255,255,255,0.6); font-size: 0.8rem;">마지막 업데이트</div>
                        <div style="color: white; font-size: 0.9rem;">${new Date().toLocaleTimeString()}</div>
                    </div>
                    <div>
                        <div style="color: rgba(255,255,255,0.6); font-size: 0.8rem;">상태</div>
                        <div style="color: #10b981; font-size: 0.9rem;">정상 운영</div>
                    </div>
                </div>
            `;
        }
        
        function showDetail(type) {
            alert(`${type} 상세 페이지는 개발 중입니다.`);
        }
        
        // 초기화
        document.addEventListener('DOMContentLoaded', function() {
            connectWebSocket();
            
            // 주기적 데이터 업데이트
            setInterval(() => {
                if (isConnected) {
                    requestData();
                }
            }, 30000); // 30초마다
        });
    </script>
</body>
</html>
